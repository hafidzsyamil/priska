# Static site: no build step. Everything Netlify serves lives in public/.
[build]
  publish = "public"
  command = ""
  # Each production deploy costs 15 credits of the Free plan's 300 per month.
  # Skip the deploy when the commit message contains "[skip netlify]" (the changes
  # ship with the next deploy), or when nothing that ships has changed (docs,
  # tests, CLAUDE.md, README). Exit 0 cancels the build; any other exit code runs it.
  ignore = "git log -1 --format=%B $COMMIT_REF | grep -qiF '[skip netlify]' || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ netlify/ netlify.toml"
